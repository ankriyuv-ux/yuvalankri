name: Materialize curated MATLAB models

on:
  push:
    paths:
      - '.staging/**'
      - '.github/workflows/materialize-matlab.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild curated MATLAB scripts
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.staging/matlab_b64_*.txt' > /dev/null; then
            echo 'No staged archive chunks; nothing to do.'
            exit 0
          fi

          cat .staging/matlab_b64_*.txt > /tmp/matlab_models.tar.xz.b64
          base64 --decode /tmp/matlab_models.tar.xz.b64 > /tmp/matlab_models.tar.xz

          mkdir -p matlab_models
          tar -xJf /tmp/matlab_models.tar.xz -C matlab_models

          # Keep only the curated history and plotting helper.
          rm -rf .staging
          rm -rf matlab_models/00_legacy
          rm -f ModelB_SurfaceSpin_LLG_ODE45_JointEarlyStop_HighAccuracy.m
          rm -f ModelB_XYZ.m

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize curated MATLAB model history [skip ci]' || exit 0
          git push
