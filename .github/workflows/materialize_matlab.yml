name: Materialize MATLAB files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild MATLAB files
        shell: bash
        env:
          PAYLOAD1: ''
          PAYLOAD2: ''
        run: |
          printf '%s%s' "$PAYLOAD1" "$PAYLOAD2" | base64 -d | gzip -d > ModelB_SurfaceSpin_LLG_ODE45_JointEarlyStop_HighAccuracy.m
          cp ModelB_SurfaceSpin_LLG_ODE45_JointEarlyStop_HighAccuracy.m ModelB_XYZ.m
          sed -i '1c function ModelB_XYZ()' ModelB_XYZ.m
          rm -f .github/workflows/materialize_matlab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add MATLAB surface-spin simulation codes'
          git push
